name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# La chaîne officielle : l'artefact est téléversé, puis publié par l'API Pages.
# `id-token: write` sert à l'attestation que `deploy-pages` présente à cette API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Volontairement `false`. Annuler la publication en cours est le bon réflexe
  # quand elles durent quelques secondes : seule la dernière compte. Mais quand
  # la file d'attente de GitHub s'allonge, chaque poussée tue la précédente et
  # plus rien n'aboutit — c'est arrivé plusieurs fois de suite, le site restant
  # silencieusement en arrière. Mieux vaut une file qui se vide lentement qu'une
  # file qui se vide dans le néant.
  cancel-in-progress: false

#
# Ce fichier a publié sur une branche `gh-pages` pendant un temps : lors d'un
# incident Actions, les déploiements créés par `actions/deploy-pages` restaient
# indéfiniment en `deployment_queued`, et l'action abandonnait au bout de dix
# minutes. Pousser le build sur une branche empruntait l'autre chaîne de
# publication, restée debout.
#
# Ce détour ne vaut que si le dépôt est réglé sur « Deploy from a branch ».
# Réglé sur « GitHub Actions », Pages ne regarde plus aucune branche : la
# poussée sur `gh-pages` réussissait, la branche portait bien le nouveau site,
# et rien n'était publié — le site est resté figé sans qu'aucune erreur ne le
# signale. Le seul indice était l'absence de « pages build and deployment »
# derrière les déploiements réussis.
#
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sans ce marqueur, Pages fait passer le site par Jekyll, qui ignore les
      # dossiers et fichiers commençant par un souligné.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
