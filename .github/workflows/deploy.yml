name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Le défaut de l'action est de 10 minutes. Deux déploiements ont
          # échoué sur `Timeout reached` alors que le build était vert, la
          # publication restant bloquée sur `deployment_queued` — un autre avait
          # mis 6 min 18 là où il en prend 6 d'ordinaire. Attendre plus coûte du
          # temps de runner ; échouer coûte un site qui reste en arrière sans
          # que rien ne l'indique.
          timeout: 1800000
