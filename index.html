<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tout est servi depuis l'origine du site : aucune requête réseau sortante,
      aucun CDN. 'wasm-unsafe-eval' est requis pour instancier le moteur WASM ;
      'unsafe-inline' en style- car les composants posent des styles inline.
      Pas de frame-ancestors : cette directive n'existe qu'en en-tête HTTP, que
      GitHub Pages ne permet pas de définir.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="Analysez vos parties de shogi dans le navigateur : courbe d'évaluation, détection des gaffes et mode entraînement."
    />
    <title>将棋 — Analyseur de parties</title>
    <!--
      GitHub Pages ne permet pas d'envoyer les en-têtes COOP/COEP nécessaires à
      SharedArrayBuffer (moteur WASM multi-thread). coi-serviceworker les injecte
      côté client. Doit rester avant le bundle applicatif.
    -->
    <script src="./coi-config.js"></script>
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
